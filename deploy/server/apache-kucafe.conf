# ═══════════════════════════════════════════════════════════════════════
#  کو کافه — vhost آپاچی (reverse proxy روی Next.js در 127.0.0.1:3000)
#
#  ═══ چرا آپاچی و نه nginx ═══
#
#  `deploy/nginx.conf` برای سروری نوشته شده بود که وب‌سرورش خودمان باشیم. سرور
#  واقعی این نیست: یک ماشین **DirectAdmin** است که آپاچی روی ۸۰ و ۴۴۳ نشسته و
#  چهار دامنه‌ی زنده‌ی دیگر را سرو می‌کند (pakerino.ir، greensmoke.ir،
#  coco.pakerino.ir، agent.pakerino.ir) به‌علاوه‌ی میل‌سرور و FTP.
#
#  نصب nginx روی ۸۰ یعنی تصادف با آپاچی و از کار افتادن آن چهار سایت. پس
#  آپاچی دست‌نخورده می‌ماند و همین‌جا فقط **یک vhost اضافه** می‌شود.
#  `mod_proxy` و `mod_proxy_http` از قبل بارگذاری‌شده‌اند.
#
#  ═══ نصب ═══
#    cp deploy/apache-kucafe.conf /etc/httpd/conf/extra/kucafe.conf
#    echo 'Include conf/extra/kucafe.conf' >> /etc/httpd/conf/extra/httpd-vhosts.conf
#    httpd -t && systemctl reload httpd
#
#  این فایل جدا است و DirectAdmin تولیدش نمی‌کند، پس با بازنویسیِ کانفیگِ DA
#  پاک نمی‌شود. تنها چیزی که ممکن است در ارتقای DA برود، همان یک خط
#  `Include` است — اگر سایت روزی ۴۰۴ داد، اول همان را چک کنید.
#
#  ═══ ⚠️ چرا آدرس صریح و نه `*:80` ═══
#
#  اولین نسخه‌ی این فایل `<VirtualHost *:80>` داشت و **چهار سایت زنده را
#  خواباند** (همه ۵۰۳ شدند). دلیلش: هر vhost دیگری روی این سرور — هم مالِ
#  DirectAdmin و هم پیش‌فرضِ آپاچی — آدرس صریحِ `45.159.115.116:80` دارد.
#  آپاچی `*:80` و `IP:80` را دو سبدِ جدا می‌شمارد، و vhostِ wildcard من
#  سبدِ خودش را ساخت و پیش‌فرضِ همه‌ی درخواست‌ها شد — پس هر دامنه‌ای به
#  پروکسیِ Node می‌رفت که آن لحظه بالا نبود.
#
#  قاعده: **آدرس این vhost باید عیناً با بقیه بخواند.** اگر IP سرور عوض شد،
#  اینجا هم باید عوض شود.
# ═══════════════════════════════════════════════════════════════════════

<VirtualHost 45.159.115.116:80>
    ServerName kucafe.ir
    ServerAlias www.kucafe.ir

    DocumentRoot /var/www/kucafe/public

    ErrorLog /var/log/httpd/kucafe-error.log
    CustomLog /var/log/httpd/kucafe-access.log combined

    # چالش Let's Encrypt باید بدون عبور از Node از دیسک پاسخ بگیرد.
    Alias /.well-known/acme-challenge/ /var/www/kucafe/public/.well-known/acme-challenge/
    ProxyPass /.well-known/acme-challenge/ !
    <Directory /var/www/kucafe/public/.well-known/acme-challenge>
        Require all granted
        Options -Indexes -ExecCGI
        AllowOverride None
    </Directory>

    # ── فشرده‌سازی ────────────────────────────────────────────────────
    #
    # `application/geo+json` حیاتی است: لایه‌های نقشه ۳.۴ مگابایت خام‌اند و با
    # gzip به ۶۷۵ کیلوبایت می‌رسند. بدون این، کل بهینه‌سازی نقشه بی‌اثر است.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml
        AddOutputFilterByType DEFLATE application/javascript text/javascript
        AddOutputFilterByType DEFLATE application/json application/geo+json
        AddOutputFilterByType DEFLATE application/xml image/svg+xml
        # WebP و woff2 از قبل فشرده‌اند — gzip رویشان فقط CPU می‌خورد.
    </IfModule>

    # آپاچی پسوند `.geojson` را نمی‌شناسد و `application/octet-stream`
    # می‌فرستد؛ آن نوع در فهرست DEFLATE بالا نیست، پس فشرده نمی‌شد.
    AddType application/geo+json .geojson
    AddType text/javascript .mjs

    # ── فایل‌های استاتیک: مستقیم از دیسک، بدون عبور از Node ───────────
    #
    # ترتیب مهم است: `ProxyPass ... !` باید **قبل** از ProxyPass ریشه بیاید،
    # وگرنه همه‌چیز به Node می‌رود و آپاچی هیچ فایلی سرو نمی‌کند.
    Alias /map/          /var/www/kucafe/public/map/
    Alias /media/        /var/www/kucafe/public/media/
    Alias /fonts/        /var/www/kucafe/public/fonts/
    Alias /maplibre/     /var/www/kucafe/public/maplibre/
    Alias /_next/static/ /var/www/kucafe/.next/static/

    ProxyPass /map/          !
    ProxyPass /media/        !
    ProxyPass /fonts/        !
    ProxyPass /maplibre/     !
    ProxyPass /_next/static/ !
    ProxyPass /cafe-photo.webp !
    ProxyPass /logo-sm.webp    !
    ProxyPass /logo.png        !
    ProxyPass /favicon.svg     !

    # صفحه‌ی خطای «سرور پایین است».
    #
    # ⚠️ این سه خط باید **قبل** از `ProxyPass /` باشند. اولین نسخه بعدش بود و
    # `/_offline.html` به Node می‌رفت که ۴۰۴ می‌داد — یعنی وقتی Node پایین
    # بود، آپاچی می‌گفت «۵۰۳، و ضمناً ErrorDocument هم ۴۰۴ شد». آپاچی قواعد
    # `ProxyPass` را به ترتیب می‌سنجد و `/` همه‌چیز را می‌گیرد.
    #
    Alias /_offline.html /var/www/kucafe/deploy/_offline.html
    ProxyPass /_offline.html !
    ErrorDocument 503 /_offline.html

    <Directory /var/www/kucafe/deploy>
        Require all granted
        Options -Indexes -ExecCGI
    </Directory>

    <Directory /var/www/kucafe/public>
        Require all granted
        Options -Indexes -ExecCGI
        AllowOverride None
    </Directory>

    <Directory /var/www/kucafe/.next/static>
        Require all granted
        Options -Indexes -ExecCGI
        AllowOverride None
    </Directory>

    # نامشان هشِ محتوا دارد و روی همان نام بازنویسی نمی‌شوند.
    <LocationMatch "^/(media|fonts|maplibre|_next/static)/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # لایه‌های نقشه با هر `map:publish` عوض می‌شوند — یک ماه، نه یک سال.
    <Location /map/>
        Header set Cache-Control "public, max-age=2592000"
    </Location>

    # ── پروکسی به Node ───────────────────────────────────────────────
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 60

    # ⚠️ اجباری. بدون این، Next فکر می‌کند درخواست روی http آمده: کوکی نشست
    # `Secure` نمی‌گیرد و ریدایرکت‌ها روی http ساخته می‌شوند — یعنی کاربر بعد
    # از ورود از https به http پرت می‌شود و نشستش گم می‌شود.
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass        / http://127.0.0.1:3000/ retry=0
    ProxyPassReverse / http://127.0.0.1:3000/


    # ── هدرهای امنیتی ────────────────────────────────────────────────
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # آپلود تصویر از پنل ادمین — پیش‌فرضِ آپاچی برای بدنه کافی است ولی
    # صریح نوشتنش جلوی سورپرایز را می‌گیرد. ۱۲ مگابایت.
    LimitRequestBody 12582912
</VirtualHost>

# ═══════════════════════════════════════════════════════════════════════
#  بلوک ۴۴۳ عمداً اینجا نیست.
#
#  گواهی TLS باید اول صادر شود، و روی این سرور DirectAdmin خودش Let's Encrypt
#  دارد. بعد از وصل‌شدن DNS:
#
#    certbot certonly --webroot -w /var/www/kucafe/public -d kucafe.ir -d www.kucafe.ir
#
#  بعد این بلوک را اضافه کنید (همان محتوای بالا + سه خط زیر)، و در آن
#  `X-Forwarded-Proto` را به `https` عوض کنید:
#
#    SSLEngine on
#    SSLCertificateFile    /etc/letsencrypt/live/kucafe.ir/fullchain.pem
#    SSLCertificateKeyFile /etc/letsencrypt/live/kucafe.ir/privkey.pem
# ═══════════════════════════════════════════════════════════════════════
