# ═══════════════════════════════════════════════════════════════════════
#  پارامترهای مشترکِ پروکسی — با `include` در هر location استفاده می‌شود.
#
#  نصب:
#    sudo mkdir -p /etc/nginx/snippets
#    sudo cp deploy/kucafe-proxy.conf /etc/nginx/snippets/kucafe-proxy.conf
#
#  چرا فایل جدا: سه location به Node پروکسی می‌کنند و تکرارِ این ۱۵ خط در
#  هر سه، جایی است که از هم می‌افتند — یکی `X-Forwarded-Proto` می‌گیرد و
#  دیگری نه، و بعد کوکیِ نشست فقط در یک مسیر `Secure` می‌شود.
# ═══════════════════════════════════════════════════════════════════════

proxy_pass http://kucafe_upstream;

# HTTP/1.1 + `Connection: ""` شرطِ کارکردنِ keepalive به upstream است.
# بدون این دو خط، `keepalive 32` در بلوک upstream هیچ اثری ندارد.
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host  $host;

# ⚠️ اجباری. بدون این، Next فکر می‌کند درخواست روی http آمده: کوکی نشست
# `Secure` نمی‌گیرد و ریدایرکت‌ها روی http ساخته می‌شوند — یعنی کاربر بعد از
# ورود از https به http پرت می‌شود و نشستش گم می‌شود.
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# بافرینگ خاموش برای استریمِ RSC: با بافرینگ، nginx تا کامل‌شدنِ پاسخ صبر
# می‌کند و مزیتِ streamingِ Next (رسیدن تدریجیِ بخش‌های صفحه) از بین می‌رود.
proxy_buffering off;

# بدنه‌ی درخواست بافر می‌شود — آپلود تصویر از پنل ادمین نباید اتصال به Node
# را در طول آپلود باز نگه دارد.
proxy_request_buffering on;
