# ═══════════════════════════════════════════════════════════════════════
#  کو کافه — nginx (reverse proxy روی Next.js در 127.0.0.1:3000)
#
#  نصب:
#    sudo mkdir -p /etc/nginx/snippets
#    sudo cp deploy/kucafe-proxy.conf /etc/nginx/snippets/kucafe-proxy.conf
#    sudo cp deploy/nginx.conf /etc/nginx/sites-available/kucafe.ir
#    sudo ln -s /etc/nginx/sites-available/kucafe.ir /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  گواهی TLS (بعد از اینکه بلوکِ ۸۰ کار کرد):
#    sudo certbot --nginx -d kucafe.ir -d www.kucafe.ir
#    certbot خودش بلوکِ ۴۴۳ و ریدایرکتِ ۸۰→۴۴۳ را اضافه می‌کند.
#
#  ⚠️ دو چیز را قبل از reload عوض کنید:
#     ۱. مسیر `/var/www/kucafe` → مسیر واقعی پروژه (sed پایین)
#     ۲. اگر پورت Next چیزی جز ۳۰۰۰ است، بلوک `upstream`
#
#  این فایل داخل بلوک `http` نگینکس include می‌شود (رفتار استاندارد
#  `sites-enabled`)، پس `upstream`، `limit_req_zone` و `map` اینجا مجازند.
# ═══════════════════════════════════════════════════════════════════════

# ── upstream ───────────────────────────────────────────────────────────
#
# `keepalive` مهم است: بدون آن nginx برای هر درخواست یک اتصال TCP تازه به
# Node می‌زند و در ترافیک متوسط هزینه‌ی handshake دیده می‌شود. فعال‌شدنش به
# دو خط در `kucafe-proxy.conf` بستگی دارد (`proxy_http_version 1.1` و
# خالی‌کردن هدر `Connection`).
upstream kucafe_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# ── محدودیت نرخ ────────────────────────────────────────────────────────
#
# اکشن‌های سرورِ Next با POST به **مسیرِ خودِ صفحه** می‌روند، نه به یک
# `/api/*` مجزا. پس محدودیتِ نوشتن روی متد اعمال می‌شود نه روی مسیر —
# `limit_except GET HEAD` پایین‌تر.
#
# ۱۰ در دقیقه برای ارسال OTP دست‌ودل‌بازانه است و جلوی سوزاندنِ اعتبار
# پیامک با یک حلقه را می‌گیرد.
limit_req_zone $binary_remote_addr zone=kucafe_write:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=kucafe_general:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name kucafe.ir www.kucafe.ir;

    # ⚠️ اینجا و در همه‌ی `alias`های پایین، مسیر پروژه روی سرور.
    #    برای عوض‌کردنِ یک‌جا:
    #      sed -i 's#/var/www/kucafe#/مسیر/واقعی/شما#g' /etc/nginx/sites-available/kucafe.ir
    #
    #    متغیر (`set $root …`) عمداً استفاده نشده: `alias` با متغیر،
    #    `try_files` را غیرقابل‌اتکا می‌کند و مسیرِ سریعِ سرو فایل nginx را
    #    خاموش می‌کند.
    root /var/www/kucafe;

    server_tokens off;
    charset utf-8;

    # ── سقف حجم بدنه ──────────────────────────────────────────────────
    #
    # آپلود تصویر از پنل ادمین انجام می‌شود؛ پیش‌فرضِ ۱ مگابایتیِ nginx
    # آپلود عکس منو را با ۴۱۳ رد می‌کرد.
    client_max_body_size 12m;
    client_body_timeout 60s;

    # ── فشرده‌سازی ────────────────────────────────────────────────────
    #
    # `application/geo+json` حیاتی است: لایه‌های نقشه ۳.۴ مگابایت خام‌اند و
    # با gzip به ۶۷۵ کیلوبایت می‌رسند. بدون این بخش، کلِ بهینه‌سازیِ نقشه
    # بی‌اثر است.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/geo+json
        application/manifest+json
        application/rss+xml
        application/xml
        image/svg+xml;

    # ــ WebP و woff2 از قبل فشرده‌اند؛ gzip رویشان فقط CPU می‌خورد و
    #    عمداً در فهرست بالا نیستند.

    # ── هدرهای امنیتی ────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS فقط **بعد از** اینکه TLS واقعاً کار کرد فعال شود، وگرنه دامنه را
    # روی یک HTTPSِ خراب قفل می‌کنید و برگشتنش سخت است:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ═══════════════════════════════════════════════════════════════════
    #  فایل‌های استاتیک — مستقیم از دیسک، بدون عبور از Node
    # ═══════════════════════════════════════════════════════════════════

    # ── لایه‌های نقشه ─────────────────────────────────────────────────
    #
    # این‌ها جای خط لوله‌ی تایلِ قبلی را گرفتند (`scripts/map-publish.mjs`).
    # با هر انتشار عوض می‌شوند و تا انتشار بعدی ثابت‌اند.
    #
    # `default_type` صریح است چون nginx پسوند `.geojson` را نمی‌شناسد و
    # `application/octet-stream` می‌فرستد — که در `gzip_types` نیست، پس
    # فشرده نمی‌شود و همان ۳.۴ مگابایت روی سیم می‌رود.
    location /map/ {
        alias /var/www/kucafe/public/map/;
        default_type application/geo+json;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # ── worker مپ‌لایبر ──────────────────────────────────────────────
    location /maplibre/ {
        alias /var/www/kucafe/public/maplibre/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── تصاویر منو و لوگو ────────────────────────────────────────────
    #
    # ۲۷٬۸۱۸ فایل WebP. نامشان از هشِ محتوا می‌آید و روی همان نام بازنویسی
    # نمی‌شوند، پس `immutable` درست است.
    location /media/ {
        alias /var/www/kucafe/public/media/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── فونت‌ها ──────────────────────────────────────────────────────
    location /fonts/ {
        alias /var/www/kucafe/public/fonts/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── دارایی‌های ساخت Next ─────────────────────────────────────────
    #
    # نامشان هشِ محتوا دارد؛ `immutable` بی‌خطر و مؤثر است.
    location /_next/static/ {
        alias /var/www/kucafe/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ــ بهینه‌ساز تصویر Next خاموش است (`images.unoptimized` در
    #    `next.config.mjs`)، پس `/_next/image` هرگز صدا زده نمی‌شود.

    location = /favicon.svg {
        root /var/www/kucafe/public;
        expires 30d;
        access_log off;
    }

    # ═══════════════════════════════════════════════════════════════════
    #  اپ — همه‌چیزِ دیگر به Next می‌رود
    # ═══════════════════════════════════════════════════════════════════
    #
    # ⚠️ هیچ کشِ upstreamی روی این‌ها نیست، و این عمدی است: تقریباً همه‌ی
    # صفحات `force-dynamic` هستند و کوکی نشست را می‌خوانند. کشِ nginx بدون
    # کلیدِ کوکی، صفحه‌ی کاربرِ وارد‌شده (با نامش و «پروفایل من») را به
    # بازدیدکننده‌ی بعدی نشان می‌دهد.
    location / {
        limit_req zone=kucafe_general burst=40 nodelay;

        # سقفِ سخت‌تر فقط روی نوشتن‌ها: ورود، ثبت نظر، مشارکت، اکشن‌های پنل.
        # خواندنِ صفحه از این سقف عبور نمی‌کند.
        limit_except GET HEAD {
            limit_req zone=kucafe_write burst=5 nodelay;
            include /etc/nginx/snippets/kucafe-proxy.conf;
        }

        include /etc/nginx/snippets/kucafe-proxy.conf;
    }

    # ── صفحه‌ی خطای سرورِ خاموش ──────────────────────────────────────
    #
    # بهتر از ۵۰۲ خالیِ nginx: کاربر می‌فهمد سایت موقتاً پایین است، نه اینکه
    # آدرس را غلط زده.
    error_page 502 503 504 /_offline.html;
    location = /_offline.html {
        root /var/www/kucafe/deploy;
        internal;
    }
}
