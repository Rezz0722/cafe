<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>کو کافه — موقتاً در دسترس نیست</title>
    <meta name="robots" content="noindex" />
    <!--
      این صفحه را nginx وقتی سرو می‌کند که Node پاسخ نمی‌دهد (۵۰۲/۵۰۳/۵۰۴).

      عمداً تک‌فایل و بدون هیچ دارایی بیرونی است: نه فونت، نه CSS، نه تصویر.
      اگر به `/_next/static` یا `/fonts` وابسته بود، در همان لحظه‌ای که به آن
      نیاز داریم — سرور پایین — نیمی از خودش هم بار نمی‌شد.

      فونت دانا اینجا نیست و این اشکالی ندارد؛ فونت سیستمی فارسی را درست
      نشان می‌دهد و این صفحه چند ثانیه دیده می‌شود.
    -->
    <style>
      :root {
        --ink: #1a1a1a;
        --muted: #7a7a7a;
        --surface: #ffffff;
        --tint: #f4f2ee;
        --primary: #5996ff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f2f2f2;
          --muted: #9aa0a8;
          --surface: #191b1f;
          --tint: #23262c;
        }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--tint);
        color: var(--ink);
        font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
        line-height: 1.9;
        text-align: center;
      }
      .card {
        max-width: 460px;
        padding: 40px 28px;
        border-radius: 20px;
        background: var(--surface);
        box-shadow: 0 8px 26px rgb(0 0 0 / 6%);
      }
      .mark {
        width: 76px;
        height: 76px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        background: var(--tint);
        color: var(--primary);
      }
      h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
      p { font-size: 0.97rem; color: var(--muted); }
      .retry {
        display: inline-block;
        margin-top: 22px;
        padding: 11px 24px;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        font-size: 0.92rem;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">
        <!-- همان آیکون Coffee که در کل سایت استفاده می‌شود، درون‌خطی. -->
        <svg
          width="38"
          height="38"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M10 2v2M14 2v2M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1" />
        </svg>
      </div>
      <h1>یک لحظه صبر کنید</h1>
      <p>
        کو کافه همین حالا در دسترس نیست — احتمالاً در حال به‌روزرسانی است.
        چند لحظه‌ی دیگر دوباره امتحان کنید.
      </p>
      <a class="retry" href="/">تلاش دوباره</a>
    </div>
  </body>
</html>
