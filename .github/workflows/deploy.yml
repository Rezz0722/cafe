name: Deploy to production

# اجرا با هر push به شاخه‌ی تولید، یا دستی از تب Actions (workflow_dispatch).
on:
  push:
    branches: [feat/nextjs-data-platform]
  workflow_dispatch: {}

# دیپلوی‌های همزمان صف می‌شوند، لغو نمی‌شوند — یک deploy.sh نیمه‌کاره روی
# سرور نمی‌ماند.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Write deploy key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/id_ed25519 <<'KEY'
          ${{ secrets.DEPLOY_SSH_KEY }}
          KEY
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.DEPLOY_SSH_PORT }}" "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # کلیدِ SSH روی سرور با `command=` محدود شده و فقط می‌تواند
      # `deploy.sh` را اجرا کند — هرچه اینجا به‌عنوان دستور بفرستیم نادیده
      # گرفته می‌شود، پس محتوای دستور اهمیتی ندارد؛ فقط خودِ اتصال کافی است.
      - name: Run deploy.sh on the server
        run: |
          ssh -p "${{ secrets.DEPLOY_SSH_PORT }}" \
              -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
              deploy
