name: CI

on:
  pull_request:
    branches: [production]
  push:
    branches-ignore: [production]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Never run pull-request code on the production self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: kucafe
          MARIADB_USER: kucafe
          MARIADB_PASSWORD: ci-only-password
          MARIADB_ROOT_PASSWORD: ci-root-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      DATABASE_URL: mysql://kucafe:ci-only-password@127.0.0.1:3306/kucafe
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      SESSION_SECRET: ci-only-session-secret-000000000000000000000000
      AUTH_DEV_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Reject committed secrets
        run: bash scripts/check-no-secrets.sh
      - name: Initialize disposable CI database
        run: npm run db:migrate
      - name: Legacy MariaDB timestamp integrity regression
        run: KUCAFE_TIMESTAMP_DB_TEST=1 node scripts/place-timestamp-regression.mjs
      - run: npm run typecheck
      - run: npm test
      - name: TopMenuMarket scraper contract (mocked source, no live requests)
        run: |
          python3 -m venv "$RUNNER_TEMP/topmenu-smoke-venv"
          "$RUNNER_TEMP/topmenu-smoke-venv/bin/python" -m pip install --disable-pip-version-check requests==2.32.5
          "$RUNNER_TEMP/topmenu-smoke-venv/bin/python" scripts/topmenu-selection-python-smoke.py
      - name: Sales intake and atomic ownership integration
        run: KUCAFE_LEAD_DB_TEST=1 node --import tsx --conditions=react-server --test src/core/leads/service.integration.test.ts
      - name: Signed menu import and atomic rollback integration
        run: KUCAFE_MENU_IMPORT_DB_TEST=1 node --import tsx --conditions=react-server --test src/core/import/venueMenuImport.integration.test.ts
      - name: Signed batch menu and atomic rollback integration
        run: KUCAFE_MENU_BATCH_DB_TEST=1 node --import tsx --conditions=react-server --test src/core/places/menuBatch.integration.test.ts
      - name: Portable menu round-trip and atomic rollback integration
        run: KUCAFE_PORTABLE_IMPORT_DB_TEST=1 node --import tsx --conditions=react-server --test src/core/import/portableMenuImport.integration.test.ts
      - name: Booking opt-in, authorization and transactional state integration
        run: KUCAFE_BOOKING_DB_TEST=1 node --import tsx --conditions=react-server --test src/core/booking/service.integration.test.ts
      - name: Event publishing, participation and authorization integration
        run: KUCAFE_EVENT_DB_TEST=1 node --import tsx --conditions=react-server --test src/core/events/service.integration.test.ts
      - name: Branch-scoped owner menu export integration
        run: KUCAFE_MENU_EXPORT_DB_TEST=1 node --import tsx --conditions=react-server --test src/core/places/menuExport.integration.test.ts
      - name: Signed branch and role authorization integration
        run: KUCAFE_AUTHZ_DB_TEST=1 node --import tsx --conditions=react-server --test src/core/auth/venueAuthorization.integration.test.ts
      - name: Owner menu protection and two real TopMenu sync cycles
        run: |
          if ! command -v mysqldump >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y mariadb-client
          fi
          KUCAFE_SOURCE_PROTECTION_DB_TEST=1 node --import tsx --conditions=react-server --test src/core/sync/menuSourceProtection.integration.test.ts
      - name: QR scope, stable redirect and aggregate integration
        run: KUCAFE_QR_DB_TEST=1 node --import tsx --conditions=react-server --test src/core/qr/channels.integration.test.ts
      - name: Menu aggregate privacy and ownership integration
        run: KUCAFE_MENU_STATS_DB_TEST=1 node --import tsx --conditions=react-server --test src/core/analytics/menuStats.integration.test.ts
      - name: Additive research curation and atomic rollback integration
        run: KUCAFE_RESEARCH_DB_TEST=1 node --import tsx --conditions=react-server --test src/core/experience/researchBatch.integration.test.ts
      - name: Production build
        run: npm run build
      - name: Signed HTTP booking route and privacy smoke
        run: KUCAFE_BOOKING_HTTP_TEST=1 node --import tsx --conditions=react-server --test src/core/booking/bookingHttp.integration.test.ts
      - name: Signed HTTP event discovery and branch privacy smoke
        run: KUCAFE_EVENT_HTTP_TEST=1 node --import tsx --conditions=react-server --test src/core/events/eventHttp.integration.test.ts
      - name: Real HTTP signed-session export authorization smoke
        run: KUCAFE_AUTHZ_HTTP_TEST=1 node --import tsx --conditions=react-server --test src/core/auth/menuExportHttp.integration.test.ts
